track = "E"
pair = "Go -> Rust"
source_repo = "https://github.com/mr-tron/base58"
source_language = "Go"
target_language = "Rust"

[original_tests]
location = "tests/original"
hashes_file = "tests/original/HASHES.txt"
bridge = "bridge/"
bridge_log = "bridge/original-tests.log"
note = """
The original Go test files run unmodified against the Rust port through a cgo
shim (bridge/): TestBase58_test2, TestInvalidAlphabet* and the fast-vs-trivial
equivalence sweep all pass against the Rust implementation. The two tests that
bind to Go package internals (mulAddBase58WordsLE; the unexported Alphabet.encode
field) cannot cross the FFI boundary and are mirrored by the src/fast.rs unit
test and tests/parity.rs. Behavioral equivalence against the published library is
additionally proven by fuzz/differential.py.
"""

[bonuses]
zero_unsafe = "enforced crate-wide via #![forbid(unsafe_code)]"
differential_fuzz = "fuzz/differential.py, log at fuzz/log.txt"
decision_log = "DECISIONS.md (12 documented divergences)"
