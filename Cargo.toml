[package]
name = "base58"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Fast, allocation-conscious Base58 codec. Behavioral port of mr-tron/base58 (Go)."
license = "MIT"
repository = "https://github.com/mr-tron/base58"
keywords = ["base58", "bitcoin", "encoding", "codec"]
categories = ["encoding", "no-std::no-alloc"]

[[bin]]
name = "base58"
path = "src/bin/base58.rs"

[lib]
name = "base58"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
